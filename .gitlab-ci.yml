# Packages the yasrt binary into a Wolfi image.
#
# The binary is built and released by yasrt/cli; this repository only packages
# it, the same split devops/images/deploy-opkssh uses. The fetch job runs before
# the build so that dist/ is present in the build context.
# Stage order follows devops/images/golang: scanning runs in `test` *after*
# `build`, because container_scanning depends on the image the build produced.
# `release` leads because that is where `version` decides; the tag itself is
# created last, in .post, once the image is built, scanned, signed and
# verified. There is no tag pipeline: the main pipeline is the release.
stages: [release, fetch, verify, build, test, sign]

variables:
  # renovate: datasource=gitlab-packages depName=yasrt/cli packageName=yasrt/cli:yasrt
  YASRT_VERSION: "1.13.2"
  CURL_IMAGE: registry.ole-hartwig.eu/devops/images/curl:8.21

include:
  # Re-scan the published image daily. A scan is otherwise only as old as the
  # last build, and this image is rebuilt only when the binary or the base
  # changes — while trivy's advisory database rolls about every six hours.
  # Runs from the pipeline schedule; every other job here stays out of it.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/container-scanning/rescan@3.11.2
    inputs:
      stage: test
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/lint-tools/lint-ci-yaml@1
    inputs:
      stage: "test"
      job-name: "lint:ci-yaml"
      targets: ".gitlab-ci.yml"
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/supply-chain-verify/base-image-pins@2
  # This repository releases itself with the tool it packages -- the first
  # image repository to do so. `version` decides in the first stage, the
  # image is fetched, verified, built, scanned, signed and verified on this
  # same pipeline, and `release` in .post creates the tag and the GitLab
  # release only after all of that passed. A job-token push starts no
  # pipeline, so nothing runs twice; there is no tag pipeline any more.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/release-tools/yasrt@2
    inputs:
      stage-version: release
      stage-release: .post
      product: image
      # The note on every merge request and closed issue of a release, as
      # release:semver's success step left it.
      mr-comments: 'true'
      rules-config:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: never
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "push"
        - when: never


  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/buildkit-image-build/buildkit-image-build@2
    inputs:
      release-tool: yasrt
      docker_context_path: '.'
      container_image_name: $CI_REGISTRY_IMAGE
      # Empty on a branch pipeline; the build then takes RELEASE_TAG from the
      # version job's handshake. A tag pipeline (none is expected any more)
      # would still use the tag.
      container_image_tag: $CI_COMMIT_TAG
      containerfile_name: Containerfile
      # verify:containerfile needs packages.wolfi.dev, which the general pool
      # cannot reach; az1a is the IPv4-capable pool.
      tags-config: ['az1a']
      # verify:containerfile really builds the file, so it cannot run in .pre:
      # the binary is fetched, not vendored, and .pre precedes the fetch.
      verify-stage: verify
      # arm64 only, like devops/images/golang: the fleet is arm64 and no
      # consumer pulls an amd64 leg.
      platforms: linux/arm64
      # A rolling major tag beside the immutable release tag, so consumers can
      # ask for "yasrt 1" rather than tracking this repository's own sequence.
      additional-tags: '1'
      cosign_enabled: 'false'
      inherit-signing: 'true'
      signing-stage: sign
      inherit-release-check: 'true'

fetch:binary:
  stage: fetch
  image: $CURL_IMAGE
  # Also on the default branch and on merge requests, not only on tags:
  # verify:containerfile builds the Containerfile for real and needs the binary
  # in the context exactly as the tag build does.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - when: never
  variables:
    PACKAGE_URL: "${CI_API_V4_URL}/projects/yasrt%2Fcli/packages/generic/yasrt/${YASRT_VERSION}"
  script:
    # Cross-project read with the job token; yasrt/cli lists this project on its
    # job-token allowlist. No long-lived credential is involved.
    - mkdir -p dist && cd dist
    # --location is not optional: the package endpoint answers 302 to the S3
    # bucket, and without it curl writes the redirect body into the file. The
    # first run did exactly that and produced a "This resource has been moved
    # temporarily" file where the binary should have been.
    - |
      for f in yasrt-linux-arm64 SHA256SUMS; do
        curl --fail-with-body --silent --show-error --location \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --output "$f" "${PACKAGE_URL}/${f}" || exit 1
      done
    # Verify before packaging: an unverified download is a supply-chain hole,
    # and the manifest is published alongside the binaries for exactly this.
    # Verify before packaging. This also catches a download that silently
    # returned something other than the binary, which is how the redirect
    # problem above announced itself.
    - grep 'yasrt-linux-arm64$' SHA256SUMS > SHA256SUMS.arm64
    - sha256sum -c SHA256SUMS.arm64
    - chmod 0755 yasrt-linux-arm64
  artifacts:
    paths: [dist/]
    expire_in: 1 day

verify:containerfile:$CI_REGISTRY_IMAGE:
  needs: [fetch:binary]

build:buildkit:image:$CI_REGISTRY_IMAGE:
  # `version` is listed so its dotenv (RELEASE_STATUS, RELEASE_TAG) reaches
  # this job: a `needs` list restricts artefacts to what it names.
  needs:
    - job: fetch:binary
    - job: version
      artifacts: true
      optional: true
  tags: [az1a]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - when: never

container_scanning:
  image: registry.ole-hartwig.eu/devops/ci-mirrors/container-scanning:8.6.35@sha256:7661c97f30d98bd71b63a4b416e59b027ed46c01d546657ee6fb2b2e575b605e
  variables:
    TRIVY_DB_REPOSITORY: registry.ole-hartwig.eu/devops/ci-mirrors/trivy-db
    TRIVY_JAVA_DB_REPOSITORY: registry.ole-hartwig.eu/devops/ci-mirrors/trivy-java-db
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - when: never

# The public mirror, filtered: .gitsigners and .gitlab/ are working material
# of this instance, not part of the image. Same job as in yasrt/cli -- the
# history is rewritten without those paths (deterministically, so the ids
# stay put) and force-pushed. Runs after release, in the same pipeline.
mirror:github:
  stage: .post
  # github.com has no IPv6 and the spot fleet no public IPv4.
  tags: [az1a]
  needs:
    - job: release
      optional: true
      artifacts: false
  image:
    name: registry.ole-hartwig.eu/devops/ci-mirrors/python:3-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  rules:
    - if: $GITHUB_MIRROR_TOKEN == null
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - apk add --no-cache git
    - pip install --quiet --root-user-action=ignore git-filter-repo
    - |
      set -eu
      git clone --quiet --mirror "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" /tmp/mirror
      cd /tmp/mirror
      git filter-repo --quiet --invert-paths --path CLAUDE.md --path .gitsigners --path .gitsigners.d --path .gitlab/
      git for-each-ref --format='%(refname)' refs/heads | while read -r ref; do
        [ "$ref" = "refs/heads/${CI_DEFAULT_BRANCH}" ] || git update-ref -d "$ref"
      done
      echo "publishing $(git rev-parse --short "${CI_DEFAULT_BRANCH}") and tags: $(git tag | tr '\n' ' ')"
      git push --force --prune "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/ohartwig/yasrt-image.git" \
        'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
      echo "mirrored to github.com/ohartwig/yasrt-image"

# The release waits for the whole chain -- build, scan, sign, attest, verify --
# not only for the stages: with `needs` the job says what its artefacts and
# its report come from. Overrides the component's stage-ordered default.
release:
  needs:
    - job: version
      artifacts: true
    - job: build:buildkit:image:$CI_REGISTRY_IMAGE
      artifacts: false
    - job: container_scanning:verdict
      optional: true
      artifacts: false
    - job: sign:image
      optional: true
      artifacts: false
    - job: attest:sbom
      optional: true
      artifacts: false
    - job: verify:image-signature:$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      optional: true
      artifacts: false
    - job: verify:release-artifact-exists
      optional: true
      artifacts: false
